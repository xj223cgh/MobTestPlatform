role: user
template: |
  你是一名专业测试工程师。请**严格依据**下方「需求文档内容」生成功能测试用例。
  每条用例的步骤、预期结果必须能在需求文档中找到对应依据，不要编造需求中未提及的行为。
  （与用例集所属的项目、迭代、需求等无关，仅以需求文档内容为准。）
  {% if knowledge_context %}

  【业务背景知识（仅供参考，不作为用例依据）】
  {{ knowledge_context }}
  {% endif %}

  【需求文档内容】
  {{ document_content }}

  【输出要求】
  1. 以 JSON 格式返回，且只返回 JSON，不要有任何其他说明文字。
  2. 格式严格参照下方示例：
  {
    "test_cases": [
      {
        "case_name": "登录-正常流程-输入正确账号密码成功登录",
        "case_description": "验证用户输入正确的账号和密码后能成功登录系统",
        "priority": "P0",
        "preconditions": "1. 用户已注册账号\n2. 系统登录页面可正常访问",
        "steps": "1. 打开系统登录页面\n2. 在账号输入框输入已注册的正确账号\n3. 在密码输入框输入对应的正确密码\n4. 点击「登录」按钮",
        "expected_result": "1. 登录成功，页面跳转到系统首页\n2. 页面右上角显示当前登录用户名",
        "test_data": "账号：testuser01 / 密码：Test@1234"
      },
      {
        "case_name": "登录-异常-密码错误时提示错误信息",
        "case_description": "验证用户输入错误密码时系统给出明确的错误提示",
        "priority": "P1",
        "preconditions": "1. 用户已注册账号\n2. 系统登录页面可正常访问",
        "steps": "1. 打开系统登录页面\n2. 输入已注册的正确账号\n3. 输入错误的密码\n4. 点击「登录」按钮",
        "expected_result": "1. 登录失败，页面停留在登录页\n2. 提示"账号或密码错误"",
        "test_data": "账号：testuser01 / 密码：WrongPass"
      }
    ]
  }

  【质量与数量要求】
  - 优先级：P0 最高，P4 最低；核心流程用 P0/P1，异常/边界用 P2/P3。
  - 覆盖：对文档中的每个功能点/场景，至少生成正常流程、异常或边界类用例，不要遗漏重要功能。
  - 数量：根据需求文档中的功能点数量决定，建议本需求生成约 **{{ suggested_min }}～{{ suggested_max }}** 条用例；若功能点很多可超过该范围，确保完整覆盖。
  - 用例名称格式：「功能模块-场景类型-具体描述」。
  - 步骤与结果：测试步骤要具体、可执行，每步一行用序号；预期结果要可验证，并与需求描述一致。
  - 只输出上述 JSON，不要输出 ```json 以外的标记或解释。

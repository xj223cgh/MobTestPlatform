role: user
template: |
  你是一名专业测试工程师。以下是一篇需求文档的第 {{ chunk_index }}/{{ total_chunks }} 部分。
  请**严格依据本段内容**生成功能测试用例，不要编造本段未提及的行为。

  【文档总览】
  {{ document_summary }}
  {% if knowledge_context %}

  【业务背景知识（仅供参考，不作为用例依据）】
  {{ knowledge_context }}
  {% endif %}

  【本段需求内容（第 {{ chunk_index }}/{{ total_chunks }} 段）】
  {{ chunk_content }}

  【输出要求】
  1. 以 JSON 格式返回，且只返回 JSON，不要有任何其他说明文字。
  2. 格式严格参照下方示例：
  {
    "test_cases": [
      {
        "case_name": "登录-正常流程-输入正确账号密码成功登录",
        "case_description": "验证用户输入正确的账号和密码后能成功登录系统",
        "priority": "P0",
        "preconditions": "1. 用户已注册账号\n2. 系统登录页面可正常访问",
        "steps": "1. 打开系统登录页面\n2. 在账号输入框输入已注册的正确账号\n3. 在密码输入框输入对应的正确密码\n4. 点击「登录」按钮",
        "expected_result": "1. 登录成功，页面跳转到系统首页\n2. 页面右上角显示当前登录用户名",
        "test_data": "账号：testuser01 / 密码：Test@1234"
      }
    ]
  }

  【质量与数量要求】
  - 优先级：P0 最高，P4 最低；核心流程用 P0/P1，异常/边界用 P2/P3。
  - 本段建议生成约 **{{ suggested_min }}～{{ suggested_max }}** 条用例，根据本段功能点数量自行增减。
  - 用例名称格式：「功能模块-场景类型-具体描述」。
  - 步骤与结果：测试步骤要具体、可执行，每步一行用序号；预期结果要可验证，并与需求描述一致。
  - 只输出上述 JSON，不要输出 ```json 以外的标记或解释。
